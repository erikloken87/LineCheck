name: Experiment - nearshore wave model probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/mop_probe.py
      - run: |
          git config user.name "linecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw/mop_probe.json
          git diff --cached --quiet || git commit -m "Nearshore wave model probe"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
