name: Update visibility conditions

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write

concurrency:
  group: conditions
  cancel-in-progress: false

jobs:
  conditions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_conditions.py
      - name: Commit conditions
        run: |
          git config user.name "linecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/app/conditions.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Conditions update $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
