name: Fetch CDFW data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 14 * * 1"   # Mondays ~6am Pacific

permissions:
  contents: write   # only what's needed to commit refreshed data

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "linecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data raw photos
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          # Scheduled runs go to a review branch; Erik approves before they reach the live app.
          # Manual runs (workflow_dispatch) publish straight to main.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git checkout -B data-refresh
            git commit -m "Data refresh $(date -u +%F) (pending review)"
            git push -f origin data-refresh
          else
            git commit -m "Data refresh $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
