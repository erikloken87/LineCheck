name: Fetch CDFW data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 14 * * 1"   # Mondays ~6am Pacific

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 shapely pillow
      - run: python scripts/fetch_data.py
      - run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "linecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data raw photos
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          # Scheduled runs go to a review branch; Erik approves before they reach the live app.
          # Manual runs (workflow_dispatch) publish straight to main.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git checkout -B data-refresh
            git commit -m "Data refresh $(date -u +%F) (pending review)"
            git push -f origin data-refresh
          else
            git commit -m "Data refresh $(date -u +%F)"
            git push
          fi
